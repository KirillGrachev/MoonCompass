name: MoonCompass
version: '${project.version}'
main: com.ney.mooncompass.MoonCompass
api-version: '1.20'
author: Ney
description: Shows player coordinates and look direction
softdepend:
  - PlaceholderAPI

commands:
  compass:
    description: Shows player coordinates and look direction
    usage: /<command> [reload]
    aliases:
      - mc
      - mooncompass

permissions:
  mooncompass.use:
    description: Access to the compass (command and click)
    default: op
  mooncompass.cooldown.bypass:
    description: Bypass the delay between compass usages
    default: false
  mooncompass.reload:
    description: Reload the plugin configuration
    default: op
